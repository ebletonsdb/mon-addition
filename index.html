<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS Resto - Bluetooth 58mm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- TOP HEADER BAR -->
    <header class="bg-slate-900 text-white p-3 flex justify-between items-center shadow-md select-none shrink-0">
        <div class="flex items-center space-x-2">
            <div class="bg-amber-500 text-slate-900 w-8 h-8 rounded-lg flex items-center justify-center font-bold">
                <i class="fa-solid font-bold text-lg fa-receipt"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-base leading-tight">Addition Restaurant</h1>
                <p id="bt-status" class="text-[10px] text-rose-400 font-medium">Enprimant pa konekte</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- BOUTON POU KONEKTE ENPRIMANT BLUETOOTH -->
            <button onclick="connectBluetoothPrinter()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1.5 active:scale-95 transition">
                <i class="fa-solid id-card fa-bluetooth"></i> Konekte BT
            </button>
            <button onclick="openHistoryModal()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-slate-700">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
            <div id="cart-counter-badge" class="bg-amber-500 text-slate-950 text-xs font-bold px-2.5 py-1.5 rounded-full">
                0
            </div>
        </div>
    </header>

    <!-- MAIN INTERFACE -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        <section class="flex-1 flex flex-col h-full overflow-y-auto p-4 border-r border-slate-200 bg-slate-50">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 max-w-lg mx-auto w-full space-y-4">
                <div class="border-b border-slate-100 pb-2">
                    <h2 class="font-extrabold text-slate-900 text-base flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-amber-500"></i> Saisir un Article
                    </h2>
                    <p class="text-xs text-slate-500">Entrez le nom du plat/boisson et le prix.</p>
                </div>

                <form onsubmit="handleCustomAdd(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Nom du Plat / Boisson</label>
                        <input type="text" id="item-name-input" placeholder="Ex: Poulet Frit, Bière..." required
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm font-semibold focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Prix Unitaire (HTG)</label>
                            <input type="number" id="item-price-input" placeholder="Ex: 500" min="1" step="any" required
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm font-bold font-mono focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Quantité</label>
                            <input type="number" id="item-qty-input" value="1" min="1" required
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm font-bold text-center focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl text-sm flex items-center justify-center gap-2 shadow-md">
                        <i class="fa-solid fa-plus font-black"></i> Ajouter à l'Addition
                    </button>
                </form>
            </div>
        </section>

        <!-- RIGHT SECTION: ADITION SUMMARY -->
        <section class="w-full md:w-80 lg:w-96 bg-white flex flex-col h-1/2 md:h-full shadow-lg border-t md:border-t-0 border-slate-200 z-10">
            <div class="p-2.5 bg-slate-50 border-b border-slate-200 space-y-2 shrink-0">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-0.5">Nom du Serveur</label>
                        <input type="text" id="server-name" placeholder="Ex: Jean" class="w-full bg-white border border-slate-300 rounded-lg text-xs font-semibold p-1.5 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-0.5">N° de Table</label>
                        <input type="text" id="order-target" placeholder="Ex: Table 1..." class="w-full bg-white border border-slate-300 rounded-lg text-xs font-semibold p-1.5 outline-none">
                    </div>
                </div>
                <div class="flex justify-end">
                    <button onclick="clearCart()" class="text-rose-500 text-xs font-semibold flex items-center gap-1 px-2 py-1 border border-rose-200 rounded-lg">
                        <i class="fa-solid fa-trash-can"></i> Tout Effacer
                    </button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-2.5 divide-y divide-slate-100" id="cart-items-container"></div>

            <div class="p-3 bg-slate-900 text-white shrink-0 shadow-inner">
                <div class="space-y-1.5 text-xs mb-3">
                    <div class="pt-1 flex justify-between items-center text-base font-bold">
                        <span class="text-amber-400">TOTAL:</span>
                        <span id="total-val" class="text-amber-400 font-mono text-xl">0.00 HTG</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button onclick="openReceiptModal()" class="bg-slate-800 text-slate-200 py-2.5 rounded-lg text-xs font-bold border border-slate-700 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-eye text-amber-400"></i> Aperçu
                    </button>
                    <button onclick="printViaBluetooth()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 py-2.5 rounded-lg text-xs font-extrabold flex items-center justify-center gap-1.5 shadow-lg">
                        <i class="fa-solid fa-print"></i> Enprime BT
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- RECEIPT PREVIEW MODAL -->
    <div id="receipt-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="bg-slate-900 text-white p-3 flex justify-between items-center">
                <h3 class="font-bold text-xs">Aperçu Facture</h3>
                <button onclick="closeReceiptModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-4 overflow-y-auto bg-slate-100 flex justify-center">
                <div class="bg-white shadow border border-slate-300 p-3 w-[58mm] font-mono text-[11px]" id="receipt-preview-content"></div>
            </div>
            <div class="p-3 bg-white border-t flex gap-2">
                <button onclick="closeReceiptModal()" class="flex-1 bg-slate-100 py-2.5 rounded-xl text-xs font-bold">Fermer</button>
                <button onclick="printViaBluetooth(); closeReceiptModal();" class="flex-1 bg-amber-500 py-2.5 rounded-xl text-xs font-bold">Enprime BT</button>
            </div>
        </div>
    </div>

    <!-- HISTORIQUE MODAL -->
    <div id="history-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md overflow-hidden shadow-2xl flex flex-col max-h-[85vh]">
            <div class="bg-slate-900 text-white p-3 flex justify-between items-center">
                <h3 class="font-bold text-xs text-amber-400">Historique des Additions</h3>
                <button onclick="closeHistoryModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-3 overflow-y-auto flex-1 divide-y" id="history-items-container"></div>
            <div class="p-3 bg-slate-50 border-t flex justify-between">
                <button onclick="clearHistory()" class="text-rose-500 text-xs font-semibold">Efase tout</button>
                <button onclick="closeHistoryModal()" class="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs">Fermer</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT BLUETOOTH ESC/POS -->
    <script>
        let currentCart = [];
        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;

        window.onload = function() { renderCart(); };

        async function connectBluetoothPrinter() {
            try {
                const statusEl = document.getElementById('bt-status');
                statusEl.innerText = "Rechèch enprimant...";
                statusEl.className = "text-[10px] text-amber-400 font-medium";

                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '49535343-fe7d-4ae5-8fa9-9fafd205e455']
                });

                const server = await bluetoothDevice.gatt.connect();
                const services = await server.getPrimaryServices();
                
                for (let service of services) {
                    const characteristics = await service.getCharacteristics();
                    for (let characteristic of characteristics) {
                        if (characteristic.properties.write || characteristic.properties.writeWithoutResponse) {
                            bluetoothCharacteristic = characteristic;
                            break;
                    }
                }
                    if (bluetoothCharacteristic) break;
                }

                if (bluetoothCharacteristic) {
                    statusEl.innerText = "Konekte: " + (bluetoothDevice.name || "POS Printer");
                    statusEl.className = "text-[10px] text-emerald-400 font-medium";
                    alert("Enprimant Bluetooth la konekte avèk siksè!");
                } else {
                    throw new Error("Pa jwenn karakteristik ekriti sou enprimant lan.");
                }
            } catch (error) {
                console.error(error);
                document.getElementById('bt-status').innerText = "Echèk koneksyon";
                document.getElementById('bt-status').className = "text-[10px] text-rose-400 font-medium";
                alert("Erè koneksyon Bluetooth: " + error.message);
            }
        }

        async function connectBluetoothPrinter() {
            try {
                const statusEl = document.getElementById('bt-status');
                statusEl.innerText = "Rechèch enprimant...";
                statusEl.className = "text-[10px] text-amber-400 font-medium";
        
                // Sèvi ak acceptAllDevices pou jwenn nenpòt enprimant tèmik ki tou prè oswa entèn
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '00001101-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455']
                });
        
                const server = await bluetoothDevice.gatt.connect();
                const services = await server.getPrimaryServices();
                
                for (let service of services) {
                    const characteristics = await service.getCharacteristics();
                    for (let characteristic of characteristics) {
                        if (characteristic.properties.write || characteristic.properties.writeWithoutResponse) {
                            bluetoothCharacteristic = characteristic;
                            break;
                        }
                    }
                    if (bluetoothCharacteristic) break;
                }
        
                if (bluetoothCharacteristic) {
                    statusEl.innerText = "Konekte: " + (bluetoothDevice.name || "POS Printer");
                    statusEl.className = "text-[10px] text-emerald-400 font-medium";
                    alert("Enprimant lan konekte avèk siksè!");
                } else {
                    throw new Error("Pa jwenn chanèl ekriti sou enprimant lan.");
                }
            } catch (error) {
                console.error(error);
                document.getElementById('bt-status').innerText = "Echèk koneksyon";
                document.getElementById('bt-status').className = "text-[10px] text-rose-400 font-medium";
                alert("Erè: " + error.message);
            }
        }

        function handleCustomAdd(e) {
            e.preventDefault();
            const nameInput = document.getElementById('item-name-input');
            const priceInput = document.getElementById('item-price-input');
            const qtyInput = document.getElementById('item-qty-input');

            const name = nameInput.value.trim();
            const price = parseFloat(priceInput.value);
            const qty = parseInt(qtyInput.value) || 1;

            if (!name || isNaN(price) || price <= 0) return;

            addItemToCart(name, price, qty);
            nameInput.value = '';
            priceInput.value = '';
            qtyInput.value = '1';
            nameInput.focus();
        }

        function addItemToCart(name, price, qty) {
            const existing = currentCart.find(i => i.name.toLowerCase() === name.toLowerCase());
            if (existing) {
                existing.qty += qty;
            } else {
                currentCart.push({ id: Date.now(), name, price, qty });
            }
            renderCart();
        }

        function updateQty(id, delta) {
            const item = currentCart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) currentCart = currentCart.filter(i => i.id !== id);
            }
            renderCart();
        }

        function clearCart() {
            currentCart = [];
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const badge = document.getElementById('cart-counter-badge');
            const totalQty = currentCart.reduce((sum, i) => sum + i.qty, 0);
            badge.innerText = totalQty;

            if (currentCart.length === 0) {
                container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-400 p-4 text-center"><p class="text-xs">L'addition est vide.</p></div>`;
                document.getElementById('total-val').innerText = '0.00 HTG';
                return;
            }

            container.innerHTML = '';
            let grandTotal = 0;
            currentCart.forEach(item => {
                let total = item.price * item.qty;
                grandTotal += total;
                const row = document.createElement('div');
                row.className = "py-2 flex items-center justify-between text-xs";
                row.innerHTML = `
                    <div class="flex-1 pr-2">
                        <p class="font-bold text-slate-800">${item.name}</p>
                        <p class="text-[10px] text-slate-500">${item.price} HTG x ${item.qty}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center bg-slate-100 rounded-lg border">
                            <button onclick="updateQty(${item.id}, -1)" class="w-6 h-6 font-bold">-</button>
                            <span class="w-6 text-center font-bold">${item.qty}</span>
                            <button onclick="updateQty(${item.id}, 1)" class="w-6 h-6 font-bold">+</button>
                        </div>
                        <span class="font-bold w-16 text-right">${total.toFixed(0)}</span>
                    </div>
                `;
                container.appendChild(row);
            });
            document.getElementById('total-val').innerText = `${grandTotal.toFixed(2)} HTG`;
        }

        function generateReceiptText() {
            const server = document.getElementById('server-name').value.trim() || 'Serveur';
            const target = document.getElementById('order-target').value.trim() || 'Table';
            let grandTotal = 0;
            let itemsText = "";

            currentCart.forEach(i => {
                let t = i.price * i.qty;
                grandTotal += t;
                itemsText += `${i.qty}x ${i.name}\n   -> ${t.toFixed(0)} HTG\n`;
            });

            const now = new Date();
            return `     RESTAURANT\n   ADDITION CLIENT\n--------------------------------\nDate: ${now.toLocaleDateString()} ${now.toLocaleTimeString()}\nLieu: ${target}\nServeur: ${server}\n--------------------------------\nARTICLE                      HTG\n--------------------------------\n${itemsText}--------------------------------\nTOTAL: ${grandTotal.toFixed(2)} HTG\n--------------------------------\n   Merci pour votre visite !\n          Bon Appetit !\n\n\n`;
        }

        function openReceiptModal() {
            if (currentCart.length === 0) return;
            document.getElementById('receipt-preview-content').innerText = generateReceiptText();
            document.getElementById('receipt-modal').classList.remove('hidden');
        }

        function closeReceiptModal() { document.getElementById('receipt-modal').classList.add('hidden'); }

        function getHistory() {
            try { return JSON.parse(localStorage.getItem('pos_history')) || []; } catch(e){ return []; }
        }

        function saveToHistory(server, target, items, total) {
            let h = getHistory();
            h.unshift({ id: Date.now(), date: new Date().toLocaleString(), server, target, items: [...items], total });
            localStorage.setItem('pos_history', JSON.stringify(h));
        }

        function openHistoryModal() {
            const container = document.getElementById('history-items-container');
            const h = getHistory();
            if (h.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-slate-400 text-xs">Okenn istorik.</div>`;
            } else {
                container.innerHTML = '';
                h.forEach(rec => {
                    container.innerHTML += `
                        <div class="py-2 text-xs flex justify-between items-center border-b">
                            <div>
                                <p class="font-bold">${rec.target} (${rec.server})</p>
                                <p class="text-[10px] text-slate-400">${rec.date} - ${rec.total} HTG</p>
                            </div>
                            <button onclick="reprintRecord(${rec.id})" class="bg-slate-900 text-amber-400 px-2 py-1 rounded text-[10px] font-bold">Réimprimer</button>
                        </div>
                    `;
                });
            }
            document.getElementById('history-modal').classList.remove('hidden');
        }

        function closeHistoryModal() { document.getElementById('history-modal').classList.add('hidden'); }
        function clearHistory() { localStorage.removeItem('pos_history'); openHistoryModal(); }

        function reprintRecord(id) {
            const h = getHistory();
            const rec = h.find(r => r.id === id);
            if (!rec) return;
            let itemsText = rec.items.map(i => `${i.qty}x ${i.name}\n   -> ${(i.price*i.qty).toFixed(0)} HTG\n`).join('');
            let text = `     RESTAURANT\n   REIMPRESSION\n--------------------------------\nDate: ${rec.date}\nLieu: ${rec.target}\nServeur: ${rec.server}\n--------------------------------\n${itemsText}--------------------------------\nTOTAL: ${rec.total.toFixed(2)} HTG\n--------------------------------\n   Merci pour votre visite !\n\n\n`;
            printDirectToBluetooth(text);
            closeHistoryModal();
        }

        function printViaBluetooth() {
            if (currentCart.length === 0) return;
            const server = document.getElementById('server-name').value.trim() || 'Serveur';
            const target = document.getElementById('order-target').value.trim() || 'Table';
            const total = currentCart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            saveToHistory(server, target, currentCart, total);
            let text = generateReceiptText();
            printDirectToBluetooth(text);
            clearCart();
            closeReceiptModal();
        }
    </script>
</body>
</html>
