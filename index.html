<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS Resto - Impression 58mm</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Modern styling optimizations for mobile touch devices */
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Hide scrollbars for slick POS UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* HIDDEN ON SCREEN SCREENSHOT/DISPLAY - But fully rendered for print engines */
        #receipt-print-area {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 58mm;
            opacity: 0;
            pointer-events: none;
        }

        /* Optimized 58mm Thermal Receipt Print Stylesheet for Android POS */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            body > *:not(#receipt-print-area) {
                display: none !important;
            }
            #receipt-print-area {
                display: block !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 58mm !important;
                padding: 0 1mm !important;
                margin: 0 !important;
                opacity: 1 !important;
                color: #000 !important;
                font-family: monospace, 'Courier New', sans-serif !important;
                font-size: 13px !important;
                font-weight: 900 !important;
                line-height: 1.3 !important;
                box-sizing: border-box !important;
            }
            @page {
                size: 58mm auto;
                margin: 0mm;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- TOP HEADER BAR -->
    <header class="bg-slate-900 text-white p-3 flex justify-between items-center shadow-md select-none shrink-0">
        <div class="flex items-center space-x-2">
            <div class="bg-amber-500 text-slate-900 w-8 h-8 rounded-lg flex items-center justify-center font-bold">
                <i class="fa-solid font-bold text-lg fa-receipt"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-base leading-tight">Addition Restaurant</h1>
                <p class="text-[10px] text-amber-400 font-medium">Imprimante</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- BOUTON HISTORIQUE (Anlè akote Article) -->
            <button onclick="openHistoryModal()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-slate-700 active:scale-95 transition">
                <i class="fa-solid fa-clock-rotate-left"></i> Historique
            </button>
            <div id="cart-counter-badge" class="bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-full">
                0 article
            </div>
        </div>
    </header>

    <!-- MAIN INTERFACE -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

        <!-- LEFT SECTION: DIRECT INPUT FOR SERVEUR -->
        <section class="flex-1 flex flex-col h-full overflow-y-auto p-4 border-r border-slate-200 bg-slate-50">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 max-w-lg mx-auto w-full space-y-4">
                <div class="border-b border-slate-100 pb-2">
                    <h2 class="font-extrabold text-slate-900 text-base flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-amber-500"></i> Saisir un Article
                    </h2>
                    <p class="text-xs text-slate-500">Entrez le nom du plat/boisson et le prix pour l'ajouter immédiatement.</p>
                </div>

                <form onsubmit="handleCustomAdd(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Nom du Plat / Boisson</label>
                        <input type="text" id="item-name-input" placeholder="Ex: Poulet Frit, Bière..." required
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm font-semibold focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Prix Unitaire (HTG)</label>
                            <input type="number" id="item-price-input" placeholder="Ex: 500" min="1" step="any" required
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm font-bold font-mono focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Quantité</label>
                            <input type="number" id="item-qty-input" value="1" min="1" required
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm font-bold text-center focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl text-sm flex items-center justify-center gap-2 shadow-md active:scale-98 transition">
                        <i class="fa-solid fa-plus font-black"></i> Ajouter à l'Addition
                    </button>
                </form>
            </div>
        </section>

        <!-- RIGHT SECTION: ADITION SUMMARY -->
        <section class="w-full md:w-80 lg:w-96 bg-white flex flex-col h-1/2 md:h-full shadow-lg border-t md:border-t-0 border-slate-200 z-10">
            
            <!-- Serveur & Table Info Header -->
            <div class="p-2.5 bg-slate-50 border-b border-slate-200 space-y-2 shrink-0">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-0.5">Nom du Serveur</label>
                        <input type="text" id="server-name" placeholder="Ex: Jean" class="w-full bg-white border border-slate-300 rounded-lg text-xs font-semibold p-1.5 focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-0.5">N° de Table</label>
                        <input type="text" id="order-target" placeholder="Ex: Table 1, À emporter..." class="w-full bg-white border border-slate-300 rounded-lg text-xs font-semibold p-1.5 focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                </div>
                <div class="flex justify-end">
                    <button onclick="clearCart()" class="text-rose-500 hover:text-rose-700 text-xs font-semibold flex items-center gap-1 rounded-lg px-2 py-1 border border-rose-200 hover:bg-rose-50">
                        <i class="fa-solid fa-trash-can"></i> Tout Effacer
                    </button>
                </div>
            </div>

            <!-- Cart Items List -->
            <div class="flex-1 overflow-y-auto p-2.5 divide-y divide-slate-100" id="cart-items-container">
                <!-- Cart items inserted dynamically -->
            </div>

            <!-- Totals & Checkout Panel (Fixed Bottom) -->
            <div class="p-3 bg-slate-900 text-white shrink-0 shadow-inner">
                <div class="space-y-1.5 text-xs mb-3">
                    <div class="pt-1 flex justify-between items-center text-base font-bold">
                        <span class="text-amber-400">TOTAL ADDITION:</span>
                        <span id="total-val" class="text-amber-400 font-mono text-xl">0.00 HTG</span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="openReceiptModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 rounded-lg text-xs font-bold border border-slate-700 flex items-center justify-center gap-1.5 active:scale-95 transition">
                        <i class="fa-solid fa-eye text-amber-400"></i> Aperçu Addition
                    </button>
                    <button onclick="triggerThermalPrint()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 py-2.5 rounded-lg text-xs font-extrabold flex items-center justify-center gap-1.5 active:scale-95 transition shadow-lg shadow-amber-500/20">
                        <i class="fa-solid fa-print"></i> Imprimer
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- RECEIPT PREVIEW MODAL -->
    <div id="receipt-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="bg-slate-900 text-white p-3 flex justify-between items-center">
                <h3 class="font-bold text-xs flex items-center gap-1.5">
                    <i class="fa-solid fa-receipt text-amber-500"></i> Facture Addition
                </h3>
                <button onclick="closeReceiptModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="p-4 overflow-y-auto bg-slate-100 flex justify-center">
                <!-- Outer 58mm preview simulation container -->
                <div class="bg-white shadow border border-slate-300 p-3 w-[58mm] min-h-[80mm] text-slate-900 font-mono text-[11px] leading-tight" id="receipt-preview-content">
                    <!-- Loaded dynamically via JS -->
                </div>
            </div>

            <div class="p-3 bg-white border-t border-slate-200 flex gap-2">
                <button onclick="closeReceiptModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs">
                    Fermer
                </button>
                <button onclick="triggerThermalPrint()" class="flex-1 bg-slate-900 hover:bg-slate-800 text-amber-400 font-extrabold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-print"></i> Imprimer
                </button>
            </div>
        </div>
    </div>

    <!-- HISTORIQUE DES FACTURES MODAL -->
    <div id="history-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md overflow-hidden shadow-2xl flex flex-col max-h-[85vh]">
            <div class="bg-slate-900 text-white p-3 flex justify-between items-center">
                <h3 class="font-bold text-xs flex items-center gap-1.5 text-amber-400">
                    <i class="fa-solid fa-clock-rotate-left"></i> Historique des Additions Passées
                </h3>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="p-3 overflow-y-auto flex-1 divide-y divide-slate-100" id="history-items-container">
                <!-- Dynamic history content -->
            </div>

            <div class="p-3 bg-slate-50 border-t border-slate-200 flex justify-between items-center">
                <button onclick="clearHistory()" class="text-rose-500 hover:text-rose-700 text-xs font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-trash-can"></i> Effacer l'historique
                </button>
                <button onclick="closeHistoryModal()" class="bg-slate-900 text-white font-bold px-4 py-2 rounded-xl text-xs">
                    Fermer
                </button>
            </div>
        </div>
    </div>

    <!-- HIDDEN ACTUAL THERMAL PRINT TARGET -->
    <div id="receipt-print-area"></div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Global State Variables
        let currentCart = [];

        // Prevent accidental page refresh / navigation / gestures
        window.addEventListener('beforeunload', function (e) {
            if (currentCart.length > 0) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        // Block shortcut keys for refresh (F5, Ctrl+R, Cmd+R)
        window.addEventListener('keydown', function (e) {
            if (
                e.key === 'F5' ||
                (e.ctrlKey && e.key.toLowerCase() === 'r') ||
                (e.metaKey && e.key.toLowerCase() === 'r')
            ) {
                e.preventDefault();
            }
        });

        // Disable pull-to-refresh on mobile / touch devices
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        // Load data on window load
        window.onload = function() {
            renderCart();
        };

        // Handle Custom Item Addition by Serveur
        function handleCustomAdd(e) {
            e.preventDefault();
            const nameInput = document.getElementById('item-name-input');
            const priceInput = document.getElementById('item-price-input');
            const qtyInput = document.getElementById('item-qty-input');

            const name = nameInput.value.trim();
            const price = parseFloat(priceInput.value);
            const qty = parseInt(qtyInput.value) || 1;

            if (!name || isNaN(price) || price <= 0) return;

            addItemToCart(name, price, qty);

            // Reset form inputs
            nameInput.value = '';
            priceInput.value = '';
            qtyInput.value = '1';
            nameInput.focus();
        }

        // Add item object to cart array
        function addItemToCart(name, price, qty) {
            const existingIndex = currentCart.findIndex(item => item.name.toLowerCase() === name.toLowerCase());
            if (existingIndex > -1) {
                currentCart[existingIndex].qty += qty;
            } else {
                currentCart.push({ id: Date.now(), name, price, qty });
            }
            renderCart();
        }

        // Update item quantity
        function updateQty(id, delta) {
            const index = currentCart.findIndex(item => item.id === id);
            if (index > -1) {
                currentCart[index].qty += delta;
                if (currentCart[index].qty <= 0) {
                    currentCart.splice(index, 1);
                }
            }
            renderCart();
        }

        // Clear all items from cart
        function clearCart() {
            if (currentCart.length === 0) return;
            currentCart = [];
            renderCart();
        }

        // Calculate and Render Cart UI
        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const badge = document.getElementById('cart-counter-badge');

            const totalQty = currentCart.reduce((sum, item) => sum + item.qty, 0);
            badge.innerText = `${totalQty} article${totalQty > 1 ? 's' : ''}`;

            if (currentCart.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 p-4 text-center">
                        <i class="fa-solid fa-basket-shopping text-4xl mb-2 text-slate-300"></i>
                        <p class="text-sm font-medium">L'addition est vide.</p>
                        <p class="text-xs text-slate-400 mt-1">Saisissez un article et son prix.</p>
                    </div>
                `;
                document.getElementById('total-val').innerText = '0.00 HTG';
                return;
            }

            container.innerHTML = '';
            let grandTotal = 0;

            currentCart.forEach(item => {
                const itemTotal = item.price * item.qty;
                grandTotal += itemTotal;

                const row = document.createElement('div');
                row.className = "py-2 flex items-center justify-between text-xs";
                row.innerHTML = `
                    <div class="flex-1 pr-2">
                        <p class="font-bold text-slate-800 leading-tight">${item.name}</p>
                        <p class="text-[10px] text-slate-500 font-mono">${item.price.toFixed(2)} HTG x ${item.qty}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center bg-slate-100 rounded-lg border border-slate-200">
                            <button onclick="updateQty(${item.id}, -1)" class="w-6 h-6 flex items-center justify-center text-slate-600 font-bold hover:bg-slate-200 rounded-l-lg">-</button>
                            <span class="w-6 text-center text-xs font-bold font-mono">${item.qty}</span>
                            <button onclick="updateQty(${item.id}, 1)" class="w-6 h-6 flex items-center justify-center text-slate-600 font-bold hover:bg-slate-200 rounded-r-lg">+</button>
                        </div>
                        <span class="font-bold text-slate-900 font-mono w-16 text-right">${itemTotal.toFixed(2)}</span>
                    </div>
                `;
                container.appendChild(row);
            });

            document.getElementById('total-val').innerText = `${grandTotal.toFixed(2)} HTG`;
        }

        // Generate thermal 58mm HTML string format
function generateReceiptHTML() {
            const serverName = document.getElementById('server-name').value.trim() || 'Serveur';
            const orderTarget = document.getElementById('order-target').value.trim() || 'Table';

            let grandTotal = 0;
            let itemsRows = '';

            currentCart.forEach(item => {
                const total = item.price * item.qty;
                grandTotal += total;
                itemsRows += `
                    <tr>
                        <td style="padding:3px 0; font-weight:normal; word-break:break-word; font-size:12px; color:#000;">${item.qty}x ${item.name}</td>
                        <td style="text-align:right; padding:3px 0; font-weight:normal; font-size:12px; color:#000; vertical-align:top;">${total.toFixed(0)}</td>
                    </tr>
                `;
            });

            const now = new Date();
            const dateStr = now.toLocaleDateString('fr-FR');
            const timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

            return `
                <div style="text-align:center; font-family:Arial, Helvetica, sans-serif; font-size:12px; color:#000; width:100%; box-sizing:border-box; -webkit-print-color-adjust: exact;">
                    <!-- ENTETE BOLD -->
                    <h2 style="font-size:18px; font-weight:900; margin:0 0 2px 0; text-transform:uppercase; letter-spacing: 0.5px;">RESTAURANT</h2>
                    <p style="margin:0; font-size:11px; font-weight:normal; text-transform:uppercase;">ADDITION CLIENT</p>
                    <p style="margin:3px 0; font-size:12px; font-weight:normal;">-----------------------------------------------</p>

                    <!-- DETAILS STANDARD -->
                    <div style="text-align:left; font-size:12px; font-weight:normal; margin-bottom:4px; line-height:1.3; color:#000;">
                        <div>Date: ${dateStr} ${timeStr}</div>
                        <div>Lieu: ${orderTarget}</div>
                        <div>Serveur: ${serverName}</div>
                    </div>

                    <p style="margin:3px 0; font-size:12px; font-weight:normal;">-----------------------------------------------</p>

                    <!-- ARTICLES STANDARD -->
                    <table style="width:100%; border-collapse:collapse; text-align:left;">
                        <thead>
                            <tr style="border-bottom: 2px solid #000; font-size:12px; font-weight:bold;">
                                <th style="padding-bottom:4px; text-align:left;">ARTICLE</th>
                                <th style="text-align:right; padding-bottom:4px;">HTG</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsRows}
                        </tbody>
                    </table>

                    <p style="margin:3px 0; font-size:12px; font-weight:normal;">-----------------------------------------------</p>

                    <!-- TOTAL BOLD -->
                    <div style="text-align:right; line-height:1.4;">
                        <div style="font-size:14px; font-weight:900; margin-top:2px;">TOTAL: ${grandTotal.toFixed(2)} HTG</div>
                    </div>

                    <p style="margin:3px 0; font-size:12px; font-weight:normal;">-----------------------------------------------</p>
                    <p style="margin:6px 0 0 0; font-weight:bold; font-size:13px;">Merci pour votre visite !</p>
                    <p style="margin:2px 0 6px 0; font-size:12px; font-weight:normal;">Bon Appétit !</p>
                    <br/><br/>
                </div>
            `;
        }

        // Open Receipt Modal
        function openReceiptModal() {
            if (currentCart.length === 0) return;
            const content = generateReceiptHTML();
            document.getElementById('receipt-preview-content').innerHTML = content;
            document.getElementById('receipt-modal').classList.remove('hidden');
        }

        // Close Receipt Modal
        function closeReceiptModal() {
            document.getElementById('receipt-modal').classList.add('hidden');
        }

        // ================= HISTORIQUE MANAGEMENT =================
        function getHistory() {
            try {
                return JSON.parse(localStorage.getItem('pos_receipt_history')) || [];
            } catch (e) {
                return [];
            }
        }

        function saveToHistory(serverName, orderTarget, cartItems, totalAmount) {
            const history = getHistory();
            const now = new Date();
            const newRecord = {
                id: Date.now(),
                date: now.toLocaleDateString('fr-FR'),
                time: now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
                server: serverName,
                target: orderTarget,
                items: [...cartItems],
                total: totalAmount
            };
            history.unshift(newRecord); // add newest first
            localStorage.setItem('pos_receipt_history', JSON.stringify(history));
        }

        function openHistoryModal() {
            renderHistory();
            document.getElementById('history-modal').classList.remove('hidden');
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        function clearHistory() {
            localStorage.removeItem('pos_receipt_history');
            renderHistory();
        }

function renderHistory() {
            const container = document.getElementById('history-items-container');
            const history = getHistory();

            if (history.length === 0) {
                container.innerHTML = `
                    <div class="p-6 text-center text-slate-400">
                        <i class="fa-solid fa-clock-rotate-left text-3xl mb-2 text-slate-300"></i>
                        <p class="text-xs font-semibold">Aucun historique d'addition enregistré.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            history.forEach(record => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'py-3 flex flex-col gap-1 text-xs';

                const itemList = record.items || record.cart || [];
                const itemsSummary = itemList.map(i => `${i.qty}x ${i.name}`).join(', ');

                itemDiv.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-bold text-slate-900">${record.target}</span>
                            <span class="text-[10px] text-slate-500 ml-1">(${record.server})</span>
                        </div>
                        <span class="font-mono font-extrabold text-amber-600">${record.total.toFixed(2)} HTG</span>
                    </div>
                    <p class="text-[11px] text-slate-600 truncate">${itemsSummary}</p>
                    <div class="flex justify-between items-center mt-1">
                        <span class="text-[10px] text-slate-400">${record.date} à ${record.time}</span>
                        <button onclick="reprintHistoryRecord(${record.id})" class="bg-slate-900 hover:bg-slate-800 text-amber-400 px-2.5 py-1 rounded-md text-[10px] font-bold flex items-center gap-1">
                            <i class="fa-solid fa-print"></i> Réimprimer
                        </button>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }

        function reprintHistoryRecord(recordId) {
            const history = getHistory();
            const record = history.find(r => r.id === recordId);
            if (!record) return;

            const printArea = document.getElementById('receipt-print-area');
            printArea.innerHTML = buildHistoryPrintHTML(record);

            setTimeout(() => {
                window.print();
                closeHistoryModal();
            }, 200);
        }
        
        function buildHistoryPrintHTML(record) {
                    const itemList = record.items || record.cart || [];
                    const itemsRows = itemList.map(item => `
                        <tr>
                            <td style="padding:3px 0; font-weight:normal; word-break:break-word; font-size:12px; color:#000;">${item.qty}x ${item.name}</td>
                            <td style="text-align:right; padding:3px 0; font-weight:normal; font-size:12px; color:#000; vertical-align:top;">${(item.price * item.qty).toFixed(0)}</td>
                        </tr>
                    `).join('');

                    return `
                        <div style="text-align:center; font-family:Arial, Helvetica, sans-serif; font-size:12px; color:#000; width:100%; box-sizing:border-box; -webkit-print-color-adjust: exact;">
                            <h2 style="font-size:18px; font-weight:900; margin:0 0 2px 0; text-transform:uppercase; letter-spacing: 0.5px;">RESTAURANT</h2>
                            <p style="margin:0; font-size:11px; font-weight:normal; text-transform:uppercase;">ADDITION CLIENT</p>
                            <p style="margin:0; font-size:8px; font-weight:normal; text-transform:uppercase;">REIMPRESSION</p>
                            <p style="margin:3px 0; font-size:12px; font-weight:normal;">-----------------------------------------------</p>

                            <div style="text-align:left; font-size:12px; font-weight:normal; margin-bottom:4px; line-height:1.3; color:#000;">
                                <div>Date: ${record.date} ${record.time}</div>
                                <div>Lieu: ${record.target}</div>
                                <div>Serveur: ${record.server}</div>
                            </div>

                            <p style="margin:3px 0; font-size:12px; font-weight:normal;">-----------------------------------------------</p>

                            <table style="width:100%; border-collapse:collapse; text-align:left;">
                                <thead>
                                    <tr style="border-bottom: 2px solid #000; font-size:12px; font-weight:bold;">
                                        <th style="padding-bottom:4px; text-align:left;">ARTICLE</th>
                                        <th style="text-align:right; padding-bottom:4px;">HTG</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${itemsRows}
                                </tbody>
                            </table>

                            <p style="margin:3px 0; font-size:12px; font-weight:normal;">-----------------------------------------------</p>

                            <div style="text-align:right; line-height:1.4;">
                                <div style="font-size:14px; font-weight:900; margin-top:2px;">TOTAL: ${record.total.toFixed(2)} HTG</div>
                            </div>

                            <p style="margin:3px 0; font-size:12px; font-weight:normal;">-----------------------------------------------</p>
                            <p style="margin:6px 0 0 0; font-weight:bold; font-size:13px;">Merci pour votre visite !</p>
                            <p style="margin:2px 0 6px 0; font-size:12px; font-weight:normal;">Bon Appétit !</p>
                            <br/><br/>
                        </div>
                    `;
                }        
            
        // Execute Thermal Print Action for 58mm Printer
    function triggerThermalPrint() {
                if (currentCart.length === 0) return;
                
                const serverName = document.getElementById('server-name').value.trim() || 'Serveur';
                const orderTarget = document.getElementById('order-target').value.trim() || 'Table';
                const grandTotal = currentCart.reduce((sum, item) => sum + (item.price * item.qty), 0);

                // Save automatically to history list
                saveToHistory(serverName, orderTarget, currentCart, grandTotal);

                const printArea = document.getElementById('receipt-print-area');
                const receiptContent = generateReceiptHTML();
                
                printArea.innerHTML = receiptContent;
                
                setTimeout(() => {
                    window.print();
                    closeReceiptModal();
                    clearCart(); // Vide panyen an otomatikman apre enpresyon an
                }, 200);
            }
    
    </script>
