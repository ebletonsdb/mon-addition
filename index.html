<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mon-addition</title>

    <!-- Shortcut / Favicon Icon -->
    <link rel="shortcut icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f59e0b'/%3E%3Cpath d='M20 14h24v36l-4-3-4 3-4-3-4 3-4-3-4 3V14z' fill='%230f172a'/%3E%3Crect x='26' y='22' width='12' height='3' rx='1' fill='%23f59e0b'/%3E%3Crect x='26' y='29' width='12' height='3' rx='1' fill='%23f59e0b'/%3E%3Crect x='26' y='36' width='8' height='3' rx='1' fill='%23f59e0b'/%3E%3C/svg%3E" type="image/svg+xml">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f59e0b'/%3E%3Cpath d='M20 14h24v36l-4-3-4 3-4-3-4 3-4-3-4 3V14z' fill='%230f172a'/%3E%3Crect x='26' y='22' width='12' height='3' rx='1' fill='%23f59e0b'/%3E%3Crect x='26' y='29' width='12' height='3' rx='1' fill='%23f59e0b'/%3E%3Crect x='26' y='36' width='8' height='3' rx='1' fill='%23f59e0b'/%3E%3C/svg%3E" type="image/svg+xml">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Modern styling optimizations for mobile touch devices */
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Hide scrollbars for slick POS UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* HIDDEN ON SCREEN SCREENSHOT/DISPLAY - But fully rendered for print engines */
        #receipt-print-area {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 58mm;
            opacity: 0;
            pointer-events: none;
        }

        /* Optimized 58mm Thermal Receipt Print Stylesheet for Android POS */
        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            html, body {
                width: 58mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
                color: #000 !important;
            }
            body > *:not(#receipt-print-area) {
                display: none !important;
            }
            #receipt-print-area {
                display: block !important;
                position: static !important;
                width: 58mm !important;
                max-width: 58mm !important;
                padding: 0 1.5mm !important;
                margin: 0 !important;
                opacity: 1 !important;
                color: #000 !important;
                background: #fff !important;
                font-family: 'Courier New', Courier, monospace !important;
                font-size: 12px !important;
                font-weight: 700 !important;
                line-height: 1.5 !important;
                box-sizing: border-box !important;
            }
            @page {
                size: 58mm auto;
                margin: 0mm;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-[100dvh] flex flex-col overflow-hidden">

    <!-- TOP HEADER BAR -->
    <header class="bg-slate-900 text-white px-3 py-2.5 flex justify-between items-center shadow-md select-none shrink-0">
        <div class="flex items-center space-x-2">
            <div class="bg-amber-500 text-slate-900 w-8 h-8 rounded-lg flex items-center justify-center font-bold">
                <i class="fa-solid font-bold text-lg fa-receipt"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-sm md:text-base leading-tight">Addition Restaurant</h1>
                <p class="text-[10px] text-amber-400 font-medium">POS Terminal 58mm</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- BOUTON HISTORIQUE (Anlè akote Article) -->
            <button onclick="openHistoryModal()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-bold px-2.5 py-1.5 rounded-full flex items-center gap-1.5 border border-slate-700 active:scale-95 transition">
                <i class="fa-solid fa-clock-rotate-left"></i> Historique
            </button>
            <div id="cart-counter-badge" class="bg-amber-500 text-slate-950 text-xs font-bold px-2.5 py-1.5 rounded-full">
                0 article
            </div>
        </div>
    </header>

    <!-- MAIN INTERFACE -->
    <main class="flex-1 min-h-0 flex flex-col md:flex-row overflow-hidden relative">

        <!-- LEFT / TOP SECTION: DIRECT INPUT FOR SERVEUR -->
        <section class="shrink-0 md:flex-1 md:h-full overflow-y-auto p-2.5 md:p-4 border-b md:border-b-0 md:border-r border-slate-200 bg-slate-50">
            <div class="bg-white p-3 md:p-4 rounded-2xl shadow-sm border border-slate-200 max-w-lg mx-auto w-full space-y-2.5 md:space-y-4">
                <div class="border-b border-slate-100 pb-1.5 md:pb-2">
                    <h2 class="font-extrabold text-slate-900 text-sm md:text-base flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-amber-500"></i> Saisir un Article
                    </h2>
                    <p class="text-[11px] md:text-xs text-slate-500 hidden sm:block">Entrez le nom du plat/boisson et le prix pour l'ajouter immédiatement.</p>
                </div>

                <form onsubmit="handleCustomAdd(event)" class="space-y-2 md:space-y-3">
                    <div>
                        <label class="block text-[11px] md:text-xs font-bold text-slate-700 mb-0.5 md:mb-1">Nom du Plat / Boisson</label>
                        <input type="text" id="item-name-input" placeholder="Ex: Poulet Frit, Bière..." required
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 md:p-2.5 text-sm font-semibold focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 md:gap-3">
                        <div>
                            <label class="block text-[11px] md:text-xs font-bold text-slate-700 mb-0.5 md:mb-1">Prix Unitaire (HTG)</label>
                            <input type="number" id="item-price-input" placeholder="Ex: 500" min="1" step="any" required
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 md:p-2.5 text-sm font-bold font-mono focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] md:text-xs font-bold text-slate-700 mb-0.5 md:mb-1">Quantité</label>
                            <input type="number" id="item-qty-input" value="1" min="1" required
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 md:p-2.5 text-sm font-bold text-center focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 md:py-3 rounded-xl text-sm flex items-center justify-center gap-2 shadow-md active:scale-98 transition">
                        <i class="fa-solid fa-plus font-black"></i> Ajouter à l'Addition
                    </button>
                </form>
            </div>
        </section>

        <!-- RIGHT / BOTTOM SECTION: ADDITION SUMMARY -->
        <section class="flex-1 min-h-0 w-full md:w-80 lg:w-96 bg-white flex flex-col md:h-full shadow-lg border-slate-200 z-10">
            
            <!-- Serveur & Table Info Header -->
            <div class="p-2 bg-slate-50 border-b border-slate-200 space-y-1.5 shrink-0">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-0.5">Nom du Serveur</label>
                        <input type="text" id="server-name" placeholder="Ex: Jean" class="w-full bg-white border border-slate-300 rounded-lg text-xs font-semibold p-1.5 focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold text-slate-400 mb-0.5">N° de Table</label>
                        <input type="text" id="order-target" placeholder="Ex: Table 1, À emporter..." class="w-full bg-white border border-slate-300 rounded-lg text-xs font-semibold p-1.5 focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                </div>
                <div class="flex justify-end">
                    <button onclick="clearCart()" class="text-rose-500 hover:text-rose-700 text-[11px] font-semibold flex items-center gap-1 rounded-lg px-2 py-0.5 border border-rose-200 hover:bg-rose-50">
                        <i class="fa-solid fa-trash-can"></i> Tout Effacer
                    </button>
                </div>
            </div>

            <!-- Cart Items List -->
            <div class="flex-1 min-h-0 overflow-y-auto p-2.5 divide-y divide-slate-100" id="cart-items-container">
                <!-- Cart items inserted dynamically -->
            </div>

            <!-- Totals & Checkout Panel (Always visible at bottom) -->
            <div class="p-2.5 md:p-3 bg-slate-900 text-white shrink-0 shadow-inner">
                <div class="flex justify-between items-center font-bold mb-2">
                    <span class="text-amber-400 text-xs md:text-sm">TOTAL ADDITION:</span>
                    <span id="total-val" class="text-amber-400 font-mono text-lg md:text-xl">0.00 HTG</span>
                </div>

                <!-- Action Buttons -->
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="openReceiptModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 md:py-2.5 rounded-lg text-xs font-bold border border-slate-700 flex items-center justify-center gap-1.5 active:scale-95 transition">
                        <i class="fa-solid fa-eye text-amber-400"></i> Aperçu Addition
                    </button>
                    <button onclick="triggerThermalPrint()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 py-2 md:py-2.5 rounded-lg text-xs font-extrabold flex items-center justify-center gap-1.5 active:scale-95 transition shadow-lg shadow-amber-500/20">
                        <i class="fa-solid fa-print"></i> Imprimer
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- RECEIPT PREVIEW MODAL -->
    <div id="receipt-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl flex flex-col max-h-[90dvh]">
            <div class="bg-slate-900 text-white p-3 flex justify-between items-center shrink-0">
                <h3 class="font-bold text-xs flex items-center gap-1.5">
                    <i class="fa-solid fa-receipt text-amber-500"></i> Facture Addition
                </h3>
                <button onclick="closeReceiptModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="p-4 overflow-y-auto bg-slate-100 flex justify-center">
                <!-- Outer 58mm preview simulation container -->
                <div class="bg-white shadow border border-slate-300 p-3 w-[58mm] min-h-[80mm] text-black font-mono text-[12px] font-bold leading-snug" id="receipt-preview-content">
                    <!-- Loaded dynamically via JS -->
                </div>
            </div>

            <div class="p-3 bg-white border-t border-slate-200 flex gap-2 shrink-0">
                <button onclick="closeReceiptModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs">
                    Fermer
                </button>
                <button onclick="triggerThermalPrint()" class="flex-1 bg-slate-900 hover:bg-slate-800 text-amber-400 font-extrabold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-print"></i> Imprimer
                </button>
            </div>
        </div>
    </div>

    <!-- HISTORIQUE DES FACTURES MODAL -->
    <div id="history-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md overflow-hidden shadow-2xl flex flex-col max-h-[85dvh]">
            <div class="bg-slate-900 text-white p-3 flex justify-between items-center shrink-0">
                <h3 class="font-bold text-xs flex items-center gap-1.5 text-amber-400">
                    <i class="fa-solid fa-clock-rotate-left"></i> Historique des Additions Passées
                </h3>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="p-3 overflow-y-auto flex-1 divide-y divide-slate-100" id="history-items-container">
                <!-- Dynamic history content -->
            </div>

            <div class="p-3 bg-slate-50 border-t border-slate-200 flex justify-between items-center shrink-0">
                <button onclick="clearHistory()" class="text-rose-500 hover:text-rose-700 text-xs font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-trash-can"></i> Effacer l'historique
                </button>
                <button onclick="closeHistoryModal()" class="bg-slate-900 text-white font-bold px-4 py-2 rounded-xl text-xs">
                    Fermer
                </button>
            </div>
        </div>
    </div>

    <!-- HIDDEN ACTUAL THERMAL PRINT TARGET -->
    <div id="receipt-print-area"></div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let currentCart = [];

        window.addEventListener('beforeunload', function (e) {
            if (currentCart.length > 0) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        window.addEventListener('keydown', function (e) {
            if (
                e.key === 'F5' ||
                (e.ctrlKey && e.key.toLowerCase() === 'r') ||
                (e.metaKey && e.key.toLowerCase() === 'r')
            ) {
                e.preventDefault();
            }
        });

        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        window.onload = function() {
            renderCart();
        };

        function handleCustomAdd(e) {
            e.preventDefault();
            const nameInput = document.getElementById('item-name-input');
            const priceInput = document.getElementById('item-price-input');
            const qtyInput = document.getElementById('item-qty-input');

            const name = nameInput.value.trim();
            const price = parseFloat(priceInput.value);
            const qty = parseInt(qtyInput.value) || 1;

            if (!name || isNaN(price) || price <= 0) return;

            addItemToCart(name, price, qty);

            nameInput.value = '';
            priceInput.value = '';
            qtyInput.value = '1';
            nameInput.focus();
        }

        function addItemToCart(name, price, qty) {
            const existingIndex = currentCart.findIndex(item => item.name.toLowerCase() === name.toLowerCase());
            if (existingIndex > -1) {
                currentCart[existingIndex].qty += qty;
            } else {
                currentCart.push({ id: Date.now(), name, price, qty });
            }
            renderCart();
        }

        function updateQty(id, delta) {
            const index = currentCart.findIndex(item => item.id === id);
            if (index > -1) {
                currentCart[index].qty += delta;
                if (currentCart[index].qty <= 0) {
                    currentCart.splice(index, 1);
                }
            }
            renderCart();
        }

        function clearCart() {
            if (currentCart.length === 0) return;
            currentCart = [];
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const badge = document.getElementById('cart-counter-badge');

            const totalQty = currentCart.reduce((sum, item) => sum + item.qty, 0);
            badge.innerText = `${totalQty} article${totalQty > 1 ? 's' : ''}`;

            if (currentCart.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 p-2 text-center">
                        <i class="fa-solid fa-basket-shopping text-2xl md:text-4xl mb-1 text-slate-300"></i>
                        <p class="text-xs md:text-sm font-medium">L'addition est vide.</p>
                        <p class="text-[11px] md:text-xs text-slate-400">Saisissez un article et son prix.</p>
                    </div>
                `;
                document.getElementById('total-val').innerText = '0.00 HTG';
                return;
            }

            container.innerHTML = '';
            let grandTotal = 0;

            currentCart.forEach(item => {
                const itemTotal = item.price * item.qty;
                grandTotal += itemTotal;

                const row = document.createElement('div');
                row.className = "py-1.5 md:py-2 flex items-center justify-between text-xs";
                row.innerHTML = `
                    <div class="flex-1 pr-2">
                        <p class="font-bold text-slate-800 leading-tight">${item.name}</p>
                        <p class="text-[10px] text-slate-500 font-mono">${item.price.toFixed(2)} HTG x ${item.qty}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center bg-slate-100 rounded-lg border border-slate-200">
                            <button onclick="updateQty(${item.id}, -1)" class="w-6 h-6 flex items-center justify-center text-slate-600 font-bold hover:bg-slate-200 rounded-l-lg">-</button>
                            <span class="w-6 text-center text-xs font-bold font-mono">${item.qty}</span>
                            <button onclick="updateQty(${item.id}, 1)" class="w-6 h-6 flex items-center justify-center text-slate-600 font-bold hover:bg-slate-200 rounded-r-lg">+</button>
                        </div>
                        <span class="font-bold text-slate-900 font-mono w-16 text-right">${itemTotal.toFixed(2)}</span>
                    </div>
                `;
                container.appendChild(row);
            });

            document.getElementById('total-val').innerText = `${grandTotal.toFixed(2)} HTG`;
        }

        function buildThermalReceiptMarkup(headerExtraHTML, dateStr, timeStr, orderTarget, serverName, itemList, grandTotal) {
            const itemsRows = itemList.map(item => {
                const lineTotal = (item.price * item.qty).toFixed(0);
                return `
                    <tr>
                        <td style="padding:5px 2px 5px 0; font-size:12px; font-weight:700; color:#000; word-break:break-word; vertical-align:top;">${item.qty}x ${item.name}</td>
                        <td style="text-align:right; padding:5px 0 5px 2px; font-size:12px; font-weight:700; color:#000; vertical-align:top; white-space:nowrap;">${lineTotal}</td>
                    </tr>
                `;
            }).join('');

            return `
                <div style="text-align:center; font-family:'Courier New', Courier, monospace; font-size:12px; font-weight:700; color:#000; width:100%; box-sizing:border-box; line-height:1.45; -webkit-text-stroke:0.2px #000;">
                    <div style="font-size:17px; font-weight:900; letter-spacing:1px; margin:0 0 2px 0; text-transform:uppercase; color:#000;">RESTAURANT</div>
                    <div style="font-size:12px; font-weight:800; text-transform:uppercase; margin-bottom:2px; color:#000;">ADDITION CLIENT</div>
                    ${headerExtraHTML || ''}
                    <div style="border-top:2px solid #000; margin:6px 0;"></div>

                    <div style="text-align:left; font-size:12px; font-weight:700; margin-bottom:6px; line-height:1.5; color:#000;">
                        <div>Date: ${dateStr} ${timeStr}</div>
                        <div>Lieu: ${orderTarget}</div>
                        <div>Serveur: ${serverName}</div>
                    </div>

                    <table style="width:100%; border-collapse:collapse; text-align:left; margin:6px 0; border-top:2px solid #000; border-bottom:2px solid #000;">
                        <thead>
                            <tr style="border-bottom:1.5px solid #000; font-size:12px; font-weight:900; color:#000;">
                                <th style="padding:5px 0; text-align:left; color:#000;">ARTICLE</th>
                                <th style="padding:5px 0; text-align:right; color:#000;">HTG</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsRows}
                        </tbody>
                    </table>

                    <div style="display:flex; justify-content:space-between; align-items:center; font-size:14px; font-weight:900; padding:4px 0 6px 0; color:#000; border-bottom:2px solid #000;">
                        <span>TOTAL:</span>
                        <span>${grandTotal.toFixed(2)} HTG</span>
                    </div>

                    <div style="margin:8px 0 2px 0; font-weight:900; font-size:12px; color:#000;">Merci pour votre visite !</div>
                    <div style="margin:2px 0 8px 0; font-weight:800; font-size:12px; color:#000;">Bon Appétit !</div>
                    <br/><br/><br/>
                </div>
            `;
        }

        function generateReceiptHTML() {
            const serverName = document.getElementById('server-name').value.trim() || 'Serveur';
            const orderTarget = document.getElementById('order-target').value.trim() || 'Table';
            const grandTotal = currentCart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const now = new Date();
            const dateStr = now.toLocaleDateString('fr-FR');
            const timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

            return buildThermalReceiptMarkup('', dateStr, timeStr, orderTarget, serverName, currentCart, grandTotal);
        }

        function openReceiptModal() {
            if (currentCart.length === 0) return;
            const content = generateReceiptHTML();
            document.getElementById('receipt-preview-content').innerHTML = content;
            document.getElementById('receipt-modal').classList.remove('hidden');
        }

        function closeReceiptModal() {
            document.getElementById('receipt-modal').classList.add('hidden');
        }

        function getHistory() {
            try {
                return JSON.parse(localStorage.getItem('pos_receipt_history')) || [];
            } catch (e) {
                return [];
            }
        }

        function saveToHistory(serverName, orderTarget, cartItems, totalAmount) {
            const history = getHistory();
            const now = new Date();
            const newRecord = {
                id: Date.now(),
                date: now.toLocaleDateString('fr-FR'),
                time: now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
                server: serverName,
                target: orderTarget,
                items: [...cartItems],
                total: totalAmount
            };
            history.unshift(newRecord);
            localStorage.setItem('pos_receipt_history', JSON.stringify(history));
        }

        function openHistoryModal() {
            renderHistory();
            document.getElementById('history-modal').classList.remove('hidden');
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        function clearHistory() {
            localStorage.removeItem('pos_receipt_history');
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history-items-container');
            const history = getHistory();

            if (history.length === 0) {
                container.innerHTML = `
                    <div class="p-6 text-center text-slate-400">
                        <i class="fa-solid fa-clock-rotate-left text-3xl mb-2 text-slate-300"></i>
                        <p class="text-xs font-semibold">Aucun historique d'addition enregistré.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            history.forEach(record => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'py-3 flex flex-col gap-1 text-xs';

                const itemList = record.items || record.cart || [];
                const itemsSummary = itemList.map(i => `${i.qty}x ${i.name}`).join(', ');

                itemDiv.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-bold text-slate-900">${record.target}</span>
                            <span class="text-[10px] text-slate-500 ml-1">(${record.server})</span>
                        </div>
                        <span class="font-mono font-extrabold text-amber-600">${record.total.toFixed(2)} HTG</span>
                    </div>
                    <p class="text-[11px] text-slate-600 truncate">${itemsSummary}</p>
                    <div class="flex justify-between items-center mt-1">
                        <span class="text-[10px] text-slate-400">${record.date} à ${record.time}</span>
                        <button onclick="reprintHistoryRecord(${record.id})" class="bg-slate-900 hover:bg-slate-800 text-amber-400 px-2.5 py-1 rounded-md text-[10px] font-bold flex items-center gap-1">
                            <i class="fa-solid fa-print"></i> Réimprimer
                        </button>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }

        function reprintHistoryRecord(recordId) {
            const history = getHistory();
            const record = history.find(r => r.id === recordId);
            if (!record) return;

            const printArea = document.getElementById('receipt-print-area');
            printArea.innerHTML = buildHistoryPrintHTML(record);

            setTimeout(() => {
                window.print();
                closeHistoryModal();
            }, 200);
        }
        
        function buildHistoryPrintHTML(record) {
            const itemList = record.items || record.cart || [];
            const extra = `<div style="font-size:10px; font-weight:900; text-transform:uppercase; margin-top:2px; color:#000;">REIMPRESSION</div>`;
            return buildThermalReceiptMarkup(extra, record.date, record.time, record.target, record.server, itemList, record.total);
        }

        function triggerThermalPrint() {
            if (currentCart.length === 0) return;
            
            const serverName = document.getElementById('server-name').value.trim() || 'Serveur';
            const orderTarget = document.getElementById('order-target').value.trim() || 'Table';
            const grandTotal = currentCart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            saveToHistory(serverName, orderTarget, currentCart, grandTotal);

            const printArea = document.getElementById('receipt-print-area');
            const receiptContent = generateReceiptHTML();
            
            printArea.innerHTML = receiptContent;
            
            setTimeout(() => {
                window.print();
                closeReceiptModal();
                clearCart();
            }, 200);
        }
    </script>
</body>
</html>
